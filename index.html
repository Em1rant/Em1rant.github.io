<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Auth & DB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 24px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .hidden {
      display: none !important;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      margin-top: 18px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
    }

    .input-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      color: #0f172a;
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      background-color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      padding: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    .btn-db {
      background-color: #0f766e;
      color: #ffffff;
    }

    .btn-db:hover {
      background-color: #115e59;
    }

    .btn-db-outline {
      background-color: #f0fdfa;
      color: #0f766e;
      border-color: #99f6e4;
    }

    .btn-db-outline:hover {
      background-color: #ccfbf1;
    }

    .oauth-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-oauth {
      background-color: #ffffff;
      color: #1e293b;
      border: 1.5px solid #e2e8f0;
    }

    .btn-oauth:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-logout {
      margin-top: 24px;
      background-color: #ef4444;
      color: #ffffff;
    }

    .btn-logout:hover {
      background-color: #dc2626;
    }

    .status-box {
      margin-top: 16px;
      padding: 10px 12px;
      font-size: 12px;
      border-radius: 8px;
      display: none;
      word-break: break-word;
      line-height: 1.4;
    }

    .status-box.error {
      display: block;
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .status-box.success {
      display: block;
      background-color: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .user-info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
      font-size: 13px;
      color: #334155;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: ФОРМА ВХОДА И РЕГИСТРАЦИИ -->
  <div id="authView" class="card">
    <h2>Supabase Auth & DB</h2>
    <p class="subtitle">Вход и регистрация</p>

    <div class="input-group">
      <label for="userEmail">Email / Логин</label>
      <div class="input-wrapper">
        <input id="userEmail" type="email" placeholder="name@example.com" autocomplete="email">
      </div>
    </div>

    <div class="input-group">
      <label for="userPassword">Пароль</label>
      <div class="input-wrapper">
        <input id="userPassword" type="password" placeholder="Минимум 6 символов" autocomplete="current-password">
        <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()">Показать</button>
      </div>
    </div>

    <div class="section-title">1. Метод Supabase Auth</div>
    <div class="grid-2">
      <button class="btn btn-secondary" onclick="authSignUp()">Auth Sign Up</button>
      <button class="btn btn-primary" onclick="authSignIn()">Auth Sign In</button>
    </div>

    <div class="section-title">2. Метод БД (Insert / Select)</div>
    <div class="grid-2">
      <button class="btn btn-db-outline" onclick="dbInsertUser()">DB Insert</button>
      <button class="btn btn-db" onclick="dbSelectUser()">DB Select (Вход)</button>
    </div>

    <div class="section-title">3. Сторонняя авторизация (OAuth)</div>
    <div class="oauth-container">
      <button class="btn btn-oauth" onclick="signInWithProvider('google')">
        Войти с помощью Google
      </button>
      <button class="btn btn-oauth" onclick="signInWithProvider('github')">
        Войти с помощью GitHub
      </button>
    </div>

    <div id="statusMessage" class="status-box"></div>
  </div>

  <!-- ЭКРАН 2: СТРАНИЦА ПОСЛЕ ВХОДА -->
  <div id="dashboardView" class="card hidden">
    <h2>Вы зашли!</h2>
    <p class="subtitle">Авторизация через Supabase успешно выполнена</p>

    <div class="user-info-box">
      <div><strong>Пользователь:</strong> <span id="loggedUserEmail">—</span></div>
      <div><strong>Способ входа:</strong> <span id="loggedMethod" class="badge">—</span></div>
      <div><strong>ID в Supabase:</strong> <span id="loggedUserId" style="font-size: 11px; color: #64748b;">—</span></div>
    </div>

    <button class="btn btn-logout" onclick="logoutUser()">Выйти</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = supabase.createClient(
      "https://jwylyajcetvgvuqdqnqf.supabase.co",
      "sb_publishable_9dzgX863H-K9aH6gadGnew_23RKElSh"
    );

    let isSigningUp = false;

    function openDashboard(email, method, id) {
      document.getElementById('loggedUserEmail').textContent = email;
      document.getElementById('loggedMethod').textContent = method;
      document.getElementById('loggedUserId').textContent = id || 'Запись из таблицы public.users';

      document.getElementById('authView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
    }

    function openAuthScreen() {
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('statusMessage').className = 'status-box';
    }

    client.auth.onAuthStateChange((event, session) => {
      console.log("[Supabase Auth Event]:", event, session);
      if (isSigningUp) return;

      if (session?.user) {
        const provider = session.user.app_metadata?.provider || 'email';
        openDashboard(session.user.email, `Supabase Auth (${provider})`, session.user.id);
      }
    });

    async function logoutUser() {
      await client.auth.signOut();
      if (window.location.hash) {
        history.replaceState(null, null, ' ');
      }
      openAuthScreen();
    }

    function showStatus(text, type) {
      const box = document.getElementById('statusMessage');
      box.textContent = text;
      box.className = 'status-box ' + type;
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('userPassword');
      const btn = document.querySelector('.toggle-pass-btn');
      if (pass.type === 'password') {
        pass.type = 'text';
        btn.textContent = 'Скрыть';
      } else {
        pass.type = 'password';
        btn.textContent = 'Показать';
      }
    }

    function getCredentials() {
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPassword').value.trim();
      if (!email || !password) {
        showStatus('Заполните оба поля (Email/Логин и Пароль)', 'error');
        return null;
      }
      return { email, password };
    }

    // --- 1. Supabase Auth ---
    async function authSignUp() {
      const creds = getCredentials();
      if (!creds) return;
      showStatus('Отправка запроса signUp в Supabase...', 'success');

      isSigningUp = true;
      const { data, error } = await client.auth.signUp({
        email: creds.email,
        password: creds.password
      });

      console.log("[SignUp Response]:", { data, error });
      if (error) {
        isSigningUp = false;
        showStatus('Ошибка SignUp: ' + error.message, 'error');
        return;
      }

      await client.auth.signOut();
      isSigningUp = false;
      showStatus('Аккаунт создан в auth.users! Теперь нажмите Auth Sign In.', 'success');
    }

    async function authSignIn() {
      const creds = getCredentials();
      if (!creds) return;
      showStatus('Проверка данных через signInWithPassword...', 'success');

      const { data, error } = await client.auth.signInWithPassword({
        email: creds.email,
        password: creds.password
      });

      console.log("[SignIn Response]:", { data, error });
      if (error) {
        showStatus('Ошибка входа: ' + error.message, 'error');
      }
    }

    // --- 2. DB Insert & Select ---
    async function dbInsertUser() {
      const creds = getCredentials();
      if (!creds) return;
      showStatus('Запись строки в таблицу users...', 'success');

      const { data, error } = await client
        .from('users')
        .insert([{ name: creds.email, password: creds.password }])
        .select('*');

      console.log("[DB Insert Response]:", { data, error });
      if (error) {
        showStatus('Ошибка БД (insert): ' + error.message, 'error');
      } else {
        showStatus(`Успешно записано в таблицу users (ID строки: ${data[0].id})! Нажмите DB Select для входа.`, 'success');
      }
    }

    async function dbSelectUser() {
      const creds = getCredentials();
      if (!creds) return;
      showStatus('Поиск строки в таблице users...', 'success');

      const { data, error } = await client
        .from('users')
        .select('*')
        .eq('name', creds.email)
        .eq('password', creds.password);

      console.log("[DB Select Response]:", { data, error });
      if (error) {
        showStatus('Ошибка БД (select): ' + error.message, 'error');
      } else if (!data || data.length === 0) {
        showStatus('Запись не найдена в таблице users (проверьте логин/пароль или RLS-политики)', 'error');
      } else {
        openDashboard(data[0].name, 'Таблица БД (SELECT)', `Строка #${data[0].id}`);
      }
    }

    // --- 3. OAuth Providers ---
    async function signInWithProvider(providerName) {
      showStatus(`Перенаправление на ${providerName}...`, 'success');
      const { error } = await client.auth.signInWithOAuth({
        provider: providerName,
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) showStatus(`Ошибка OAuth: ${error.message}`, 'error');
    }
  </script>
</body>
</html>
