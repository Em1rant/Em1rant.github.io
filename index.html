<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Auth & DB Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 24px;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .auth-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      margin-top: 18px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
    }

    .input-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      color: #0f172a;
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      background-color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      padding: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    .btn-db {
      background-color: #0f766e;
      color: #ffffff;
    }

    .btn-db:hover {
      background-color: #115e59;
    }

    .btn-db-outline {
      background-color: #f0fdfa;
      color: #0f766e;
      border-color: #99f6e4;
    }

    .btn-db-outline:hover {
      background-color: #ccfbf1;
    }

    .oauth-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-oauth {
      background-color: #ffffff;
      color: #1e293b;
      border: 1.5px solid #e2e8f0;
      font-size: 13px;
    }

    .btn-oauth:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    .status-box {
      margin-top: 16px;
      padding: 10px 12px;
      font-size: 12px;
      border-radius: 8px;
      display: none;
      word-break: break-word;
      line-height: 1.4;
    }

    .status-box.error {
      display: block;
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .status-box.success {
      display: block;
      background-color: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Supabase Auth & DB</h2>
    <p class="subtitle">Тестирование двух типов авторизации и OAuth</p>

    <div class="input-group">
      <label for="userEmail">Email / Логин</label>
      <div class="input-wrapper">
        <input id="userEmail" type="email" placeholder="name@example.com" autocomplete="email">
      </div>
    </div>

    <div class="input-group">
      <label for="userPassword">Пароль</label>
      <div class="input-wrapper">
        <input id="userPassword" type="password" placeholder="Минимум 6 символов" autocomplete="current-password">
        <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()">Показать</button>
      </div>
    </div>

    <!-- Тип 1: Стандартная Auth (SignUp / SignIn) -->
    <div class="section-title">1. Метод Supabase Auth</div>
    <div class="grid-2">
      <button class="btn btn-secondary" onclick="authSignUp()">Auth Sign Up</button>
      <button class="btn btn-primary" onclick="authSignIn()">Auth Sign In</button>
    </div>

    <!-- Тип 2: Прямая работа с таблицей users (Insert / Select) -->
    <div class="section-title">2. Метод БД (Insert / Select)</div>
    <div class="grid-2">
      <button class="btn btn-db-outline" onclick="dbInsertUser()">DB Insert</button>
      <button class="btn btn-db" onclick="dbSelectUser()">DB Select (Вход)</button>
    </div>

    <!-- Тип 3: OAuth Провайдеры -->
    <div class="section-title">3. Сторонняя авторизация (OAuth)</div>
    <div class="oauth-container">
      <button class="btn btn-oauth" onclick="signInWithProvider('google')">
        Войти с помощью Google
      </button>
      <button class="btn btn-oauth" onclick="signInWithProvider('github')">
        Войти с помощью GitHub
      </button>
      <button class="btn btn-oauth" onclick="signInWithProvider('apple')">
        Войти с помощью Apple
      </button>
    </div>

    <div id="statusMessage" class="status-box"></div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const client = supabase.createClient(
    "https://jwylyajcetvgvuqdqnqf.supabase.co",
    "sb_publishable_9dzgX863H-K9aH6gadGnew_23RKElSh"
  );

  // Автоматическая проверка: вошел ли пользователь
  client.auth.onAuthStateChange((event, session) => {
    console.log("Auth Event:", event, session);
    if (session?.user) {
      showStatus(`Успешный вход через ${session.user.app_metadata.provider || 'email'}! Вы вошли как: ${session.user.email}`, 'success');
      
      // Меняем кнопку входа на кнопку "Выйти"
      const actionArea = document.querySelector('.oauth-container');
      actionArea.innerHTML = `
        <button class="btn btn-secondary" style="border-color:#ef4444; color:#ef4444;" onclick="client.auth.signOut().then(() => location.reload())">
          Выйти из аккаунта (Sign Out)
        </button>
      `;
    }
  });

  function showStatus(text, type) {
    const box = document.getElementById('statusMessage');
    box.textContent = text;
    box.className = 'status-box ' + type;
  }

  function togglePasswordVisibility() {
    const pass = document.getElementById('userPassword');
    const btn = document.querySelector('.toggle-pass-btn');
    if (pass.type === 'password') {
      pass.type = 'text';
      btn.textContent = 'Скрыть';
    } else {
      pass.type = 'password';
      btn.textContent = 'Показать';
    }
  }

  function getCredentials() {
    const email = document.getElementById('userEmail').value.trim();
    const password = document.getElementById('userPassword').value.trim();
    if (!email || !password) {
      showStatus('Заполните оба поля (Email/Логин и Пароль)', 'error');
      return null;
    }
    return { email, password };
  }

  async function authSignUp() {
    const creds = getCredentials();
    if (!creds) return;
    showStatus('Auth: создаем аккаунт...', 'success');
    const { data, error } = await client.auth.signUp({ email: creds.email, password: creds.password });
    if (error) showStatus('Ошибка Auth SignUp: ' + error.message, 'error');
    else showStatus('Успешный SignUp! ID: ' + (data.user?.id || 'создан'), 'success');
  }

  async function authSignIn() {
    const creds = getCredentials();
    if (!creds) return;
    showStatus('Auth: вход...', 'success');
    const { data, error } = await client.auth.signInWithPassword({ email: creds.email, password: creds.password });
    if (error) showStatus('Ошибка Auth SignIn: ' + error.message, 'error');
    else showStatus('Успешный Auth SignIn! ' + data.user.email, 'success');
  }

  async function dbInsertUser() {
    const creds = getCredentials();
    if (!creds) return;
    showStatus('БД: запись через insert()...', 'success');
    const { data, error } = await client.from('users').insert([{ name: creds.email, password: creds.password }]).select('*');
    if (error) showStatus('Ошибка DB Insert: ' + error.message, 'error');
    else showStatus('Запись сохранена в таблице users!', 'success');
  }

  async function dbSelectUser() {
    const creds = getCredentials();
    if (!creds) return;
    showStatus('БД: поиск через select()...', 'success');
    const { data, error } = await client.from('users').select('*').eq('name', creds.email).eq('password', creds.password);
    if (error) showStatus('Ошибка DB Select: ' + error.message, 'error');
    else if (!data || data.length === 0) showStatus('Пользователь не найден в таблице', 'error');
    else showStatus('Вход выполнен через БД! Найдена запись: ' + data[0].name, 'success');
  }

  async function signInWithProvider(providerName) {
    showStatus(`Перенаправление на ${providerName}...`, 'success');
    const { error } = await client.auth.signInWithOAuth({
      provider: providerName,
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) showStatus(`Ошибка OAuth: ${error.message}`, 'error');
  }
</script>
  
</body>
</html>
