name: Flutter Build Web and APK
on:
  push:
    branches: [ "branch_build/web" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web

      - name: Commit and Push build/web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/web -f
          git commit -m "Auto-build: update build/web [skip ci]" || echo "No changes to commit"
          git push origin HEAD:branch_build/web